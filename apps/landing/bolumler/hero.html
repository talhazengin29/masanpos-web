<!-- ==========================================================================
     Hero — ana başlık ve birincil çağrı butonları.
     ========================================================================== -->
<section class="relative px-6 pb-16 pt-32 md:pt-40" id="ust">
  <div class="mx-auto max-w-4xl text-center">
    <div class="hero-akis-kapsayici" aria-label="MasanPOS operasyon akışı: QR Menü, Sipariş, Mutfak ve Ödeme">
      <div class="hero-akis">
        <span class="hero-akis-adim">
          <span class="hero-akis-ikon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h5v5H4V4Zm11 0h5v5h-5V4ZM4 15h5v5H4v-5Zm11 0h2v2h-2v-2Zm3 0h2v5h-5v-2M12 4v3m0 3v2h3m5 0h-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>QR Menü</span>
        </span>
        <i class="hero-akis-baglanti" aria-hidden="true"></i>
        <span class="hero-akis-adim">
          <span class="hero-akis-ikon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3h10v3H7V3Zm-2 3h14v15H5V6Zm3.5 4h7M8.5 14h5M8.5 18h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Sipariş</span>
        </span>
        <i class="hero-akis-baglanti" aria-hidden="true"></i>
        <span class="hero-akis-adim">
          <span class="hero-akis-ikon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 20h14M7 20v-8a5 5 0 0 1 10 0v8M9 8.5V5m3 2V3m3 5.5V5M4 12h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Mutfak</span>
        </span>
        <i class="hero-akis-baglanti" aria-hidden="true"></i>
        <span class="hero-akis-adim">
          <span class="hero-akis-ikon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v11H4V7Zm0 4h16M8 15h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>Ödeme</span>
        </span>
      </div>
      <p>Masadan mutfağa tek akış</p>
    </div>

    <h1 class="hero-baslik mb-6 text-balance font-baslik text-[2rem] font-bold leading-tight tracking-tight sm:text-5xl md:text-7xl">
      <span class="metin-akan">{{ heroBaslikBir }}</span> <span class="metin-gradyan">{{ heroVurguBir }}</span><br/>
      <span class="metin-akan">{{ heroBaslikIki }}</span> <span class="metin-gradyan">{{ heroVurguIki }}</span>
    </h1>

    <p class="hero-aciklama mx-auto mb-10 max-w-2xl text-base leading-relaxed text-marka-gri-300 md:text-lg">
      {{ heroAciklama }}
    </p>

    <div class="hero-butonlar flex flex-col items-center justify-center gap-4 sm:flex-row">
      <a class="marka-buton inline-block rounded-full px-8 py-4 text-base font-medium" href="#fiyatlandirma">
        {{ heroBirincilButon }}
      </a>
      <a class="inline-block rounded-full border border-marka-cizgi px-8 py-4 text-base font-medium text-marka-metin transition-colors hover:border-marka-gri-400 hover:bg-white/5" href="#ozellikler">
        {{ heroIkincilButon }}
      </a>
    </div>
  </div>
</section>
